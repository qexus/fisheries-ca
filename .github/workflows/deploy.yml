name: Canada fisheries — refresh registry and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * 1' # Weekly Monday UTC, approximate timing

permissions:
  contents: read

concurrency:
  group: pages-canada
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # necessary only to commit validated official registry snapshot
      pages: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Record official-source-only vacancy mode
        run: |
          python scripts/refresh_jobs.py --out public/generated/jobs.json
          python -m json.tool public/generated/jobs.json > /dev/null
      - name: Validate Academy curriculum and JavaScript
        run: |
          node tests/check_content.mjs
          node tests/check_locales.mjs
          node tests/check_switch_labels.mjs
          node tests/check_backup.mjs
          node tests/check_app_locales.mjs
          node tests/check_layout.mjs
          node tests/check_journey.mjs
          node tests/check_desk.mjs
          node tests/check_practicum.mjs
          node tests/check_source_quality.mjs
          for file in public/*.js; do node --check "$file"; done
      - name: Download official CFIA and DFO BC registries
        # Network/schema problems are reported in the generated JSON; stale snapshots are retained.
        run: python scripts/refresh_registry.py --out public/generated/registry.json
      - name: Security scan before publishing
        run: python scripts/security_audit.py
      - name: Validate public-only site
        run: |
          test -s public/index.html
          test -s public/app.js
          test -s public/data.js
          test -s public/generated/registry.json
          test -s public/generated/jobs.json
          python -m json.tool public/generated/registry.json > /dev/null
          if find public -type f \( -iname '*.pdf' -o -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.env' -o -iname '*resume*' -o -iname '*cv_*' \) | grep .; then
            echo 'Private or unexpected file in public/'
            exit 1
          fi
      - name: Commit validated registry snapshot for fallback on next run
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/generated/registry.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh public Canada registry [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
